<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Event Handling trong JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            line-height: 1.6;
        }

        .card {
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #fdfdfd;
        }

        ul {
            padding-left: 20px;
        }

        li {
            cursor: pointer;
            padding: 6px 10px;
            margin: 4px 0;
            background: #eef2f7;
            border-radius: 4px;
            transition: 0.2s;
        }

        li:hover {
            background: #dfe4ea;
        }

        input,
        select,
        button {
            padding: 8px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <h2>Học Xử Lý Sự Kiện (Event Handling)</h2>

    <!-- PHẦN 1: addEventListener (click, keyup, change) -->
    <div class="card">
        <h3>1. addEventListener (Click, Keyup, Change)</h3>
        <button id="clickBtn">Bấm vào tôi (Click)</button>
        <br><br>
        <input type="text" id="textInput" placeholder="Gõ gì đó vào đây (Keyup)...">
        <p>Bạn vừa gõ: <span id="output" style="color: blue; font-weight: bold;"></span></p>

        <br>
        <select id="selectColor">
            <option value="">-- Chọn màu nền (Change) --</option>
            <option value="#ffcccc">Đỏ nhạt</option>
            <option value="#ccffcc">Xanh nhạt</option>
            <option value="#ffffcc">Vàng nhạt</option>
        </select>
    </div>

    <!-- PHẦN 2: preventDefault -->
    <div class="card">
        <h3>2. Ngăn chặn hành vi mặc định (preventDefault)</h3>
        <form id="myForm">
            <input type="text" id="username" placeholder="Nhập tên tài khoản...">
            <button type="submit">Gửi Form (Submit)</button>
        </form>
        <p id="formMsg" style="font-weight: bold;"></p>
    </div>

    <!-- PHẦN 3: Event Delegation -->
    <div class="card">
        <h3>3. Ủy quyền sự kiện (Event Delegation)</h3>
        <p>Bấm vào bất kỳ mục nào bên dưới (kể cả mục mới được thêm):</p>
        <ul id="itemList">
            <li>Sản phẩm A</li>
            <li>Sản phẩm B</li>
        </ul>
        <button id="addItemBtn">Thêm sản phẩm mới</button>
    </div>

    <script>
        // --- PHẦN 1: Demo addEventListener ---
        const clickBtn = document.querySelector("#clickBtn");
        clickBtn.addEventListener("click", () => {
            alert("Đã bắt được sự kiện click chuột!");
        });

        const textInput = document.querySelector("#textInput");
        const output = document.querySelector("#output");
        textInput.addEventListener("keyup", (event) => {
            // event.target.value lấy giá trị hiện tại của ô input
            output.textContent = event.target.value;
        });

        const selectColor = document.querySelector("#selectColor");
        selectColor.addEventListener("change", (event) => {
            const chosenColor = event.target.value;
            document.body.style.backgroundColor = chosenColor;
        });


        // --- PHẦN 2: Demo preventDefault ---
        const myForm = document.querySelector("#myForm");
        const usernameInput = document.querySelector("#username");
        const formMsg = document.querySelector("#formMsg");

        myForm.addEventListener("submit", (event) => {
            // 🛑 CHẶN TRANG WEB KHÔNG BỊ RELOAD MẶC ĐỊNH
            event.preventDefault();

            if (usernameInput.value.trim() === "") {
                formMsg.textContent = "❌ Tên tài khoản không được để trống!";
                formMsg.style.color = "red";
            } else {
                formMsg.textContent = `✅ Đã xử lý gửi form thành công cho: ${usernameInput.value}`;
                formMsg.style.color = "green";
            }
        });


        // --- PHẦN 3: Demo Event Delegation ---
        const itemList = document.querySelector("#itemList");
        const addItemBtn = document.querySelector("#addItemBtn");

        // Thay vì gắn event cho từng thẻ <li>, ta gán trực tiếp cho thẻ CHA <ul> (itemList)
        itemList.addEventListener("click", (event) => {
            // Kiểm tra xem người dùng có bấm đúng vào thẻ LI con bên trong hay không
            if (event.target && event.target.nodeName === "LI") {
                alert(`Bạn vừa chọn: ${event.target.textContent}`);
            }
        });

        let itemIndex = 3;
        addItemBtn.addEventListener("click", () => {
            const newLi = document.createElement("li");
            newLi.textContent = `Sản phẩm động ${itemIndex++}`;
            itemList.appendChild(newLi); // Thẻ mới sinh ra tự động bắt được sự kiện nhờ Event Delegation!
        });
    </script>

</body>

</html>
