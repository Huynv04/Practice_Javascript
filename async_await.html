        //---------------------------------------------------------------------
        //3. Chạy song song nhiều tác vụ: Promise.all() vs Promise.allSettled()
        const api1 = Promise.resolve("Dữ liệu Sản phẩm OK");
        const api2 = Promise.reject("Lỗi kết nối API Banner"); // Giả sử API này tạch

        // --- 1. DÙNG PROMISE.ALL (Sẽ bị lỗi văng ra catch ngay lập tức) ---
        Promise.all([api1, api2])
            .then(results => console.log("Promise.all thành công:", results))
            .catch(err => console.log("❌ Promise.all bị hủy vì có 1 lỗi:", err));


        // --- 2. DÙNG PROMISE.ALLSETTLED (Lấy trọn vẹn trạng thái từng cái) ---
        Promise.allSettled([api1, api2])
            .then(results => {
                console.log("✅ Promise.allSettled trả về toàn bộ kết quả:");
                results.forEach((res, index) => {
                    if (res.status === "fulfilled") {
                        console.log(`- Tác vụ ${index + 1} thành công:`, res.value);
                    } else {
                        console.log(`- Tác vụ ${index + 1} thất bại:`, res.reason);
                    }
                });
            });
